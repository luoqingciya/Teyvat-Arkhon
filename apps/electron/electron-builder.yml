# Teyvat Arkhon - electron-builder 配置
# 由 GitHub Actions（.github/workflows/release.yml）在推送 tag 时执行打包与发布

appId: com.teyvat.arkhon
productName: Teyvat Arkhon

directories:
  output: release
  buildResources: build

files:
  - "out/**"
  - "!**/*.map"

# 内核资源：mihomo 二进制、geo 数据、wintun 驱动
extraResources:
  - from: resources/core
    to: core
    filter:
      - "**/*"
      - "!.gitkeep"
  # 托盘图标（主进程 nativeImage 直接读取）
  - from: build/icon.png
    to: icon.png

# 许可证合规：electron-builder 自动包含仓库根 LICENSE 文件进产物（GPL-3.0）
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: Teyvat Arkhon

linux:
  target:
    - AppImage
    - deb
  category: Network
  artifactName: ${productName}-${version}-linux-${arch}.${ext}

# 自动更新：基于 GitHub Releases
publish:
  provider: github
  owner: luoqingciya
  repo: Teyvat-Arkhon
  releaseType: release