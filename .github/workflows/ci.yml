name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 单元测试 / 类型检查 / 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建基础包
        run: 'pnpm -r --if-present --filter "./packages/**" build'
      - name: 单元测试
        run: pnpm --filter @teyvat-arkhon/core-bridge exec vitest run
      - name: 类型检查
        run: pnpm --filter @teyvat-arkhon/electron typecheck
      - name: 代码规范检查
        run: pnpm lint
      - name: 构建 Electron 应用
        run: pnpm --filter @teyvat-arkhon/electron build
      # 沙箱约束：preload 产物只能 require('electron')。
      # 渲染进程启用了 sandbox，沙箱化 preload 引入任何其它运行时依赖都会直接抛错，
      # 表现为 window.arkhon 未暴露、界面全白（2026-10-10 曾因通道常量化把 shared 变成
      # 运行时依赖而触发）。此处做静态断言，避免同类回归再次静默发生。
      - name: 校验 preload 沙箱约束
        shell: bash
        run: |
          OUT=apps/electron/out/preload/index.js
          EXTRA=$(grep -oE 'require\("[^"]+"\)' "$OUT" | sort -u | grep -v 'require("electron")' || true)
          if [ -n "$EXTRA" ]; then
            echo "::error::preload 产物存在 electron 之外的运行时依赖：$EXTRA（会破坏 sandbox）"
            exit 1
          fi
          echo "✓ preload 仅依赖 electron"

  ui:
    name: Playwright UI 冒烟（Windows）
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建基础包与应用
        run: pnpm prebuild-deps && pnpm --filter @teyvat-arkhon/electron build
      - name: UI 冒烟
        run: pnpm --filter @teyvat-arkhon/electron exec playwright test