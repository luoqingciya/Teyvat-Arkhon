name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# electron-updater 需要创建 Release 并上传资产
permissions:
  contents: write

jobs:
  package:
    name: 打包 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载内核与数据（mihomo/geo/wintun，含 sha256 校验）
        run: node scripts/download-core.mjs v1.19.30

      - name: 构建基础包与应用
        run: |
          pnpm prebuild-deps
          pnpm --filter @teyvat-arkhon/electron build

      # 发布前内核全链路闸门：订阅导入→启动→路由→流量→热重载（防"本机绿、打包崩"）
      - name: 内核全链路 E2E
        run: node scripts/e2e-core.cjs

      - name: 打包发布
        run: pnpm --filter @teyvat-arkhon/electron exec electron-builder -- --publish always

      - name: 打包产物启动冒烟（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y xvfb
          BIN=$(find apps/electron/release -path '*linux-unpacked*' -type f -executable ! -name '*.so*' | head -n1)
          echo "冒烟二进制: $BIN"
          xvfb-run -a "$BIN" --no-sandbox --disable-gpu > smoke.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "✓ 应用进程存活，冒烟通过"
            kill $PID || true
          else
            echo "✗ 应用启动即退出，日志如下："
            cat smoke.log || true
            exit 1
          fi

      - name: 打包产物启动冒烟（Windows）
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $exe = Get-ChildItem "apps/electron/release/win-unpacked/*.exe" | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          Write-Output "冒烟二进制: $($exe.FullName)"
          $p = Start-Process $exe.FullName -ArgumentList '--no-sandbox' -PassThru
          Start-Sleep -Seconds 6
          if ($p.HasExited) {
            Write-Error ("应用启动即退出，code=" + $p.ExitCode)
            exit 1
          }
          Write-Output "✓ 应用进程存活，冒烟通过"
          Stop-Process -Id $p.Id -Force

      - name: GPL 合规检查（LICENSE 进产物）
        run: |
          test -f apps/electron/release/linux*/*.AppImage -o -f apps/electron/release/*.exe && echo "产物存在"
          find apps/electron/release -name "LICENSE*" | head -3

      - name: 上传产物（无 GH_TOKEN 时仍保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: apps/electron/release/**
          if-no-files-found: ignore