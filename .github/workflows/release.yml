name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# electron-updater 需要创建 Release 并上传资产
permissions:
  contents: write

jobs:
  package:
    name: 打包 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载内核与数据（mihomo/geo/wintun）
        run: node scripts/download-core.mjs v1.19.30

      - name: 构建与打包
        run: |
          pnpm prebuild-deps
          pnpm --filter @teyvat-arkhon/electron build
          pnpm --filter @teyvat-arkhon/electron exec electron-builder -- --publish always

      - name: GPL 合规检查（LICENSE 进产物）
        run: |
          test -f release/linux*/*.AppImage -o -f release/*.exe && echo "产物存在"
          find release -name "LICENSE*" | head -3

      - name: 上传产物（无 GH_TOKEN 时仍保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: release/**
          if-no-files-found: ignore