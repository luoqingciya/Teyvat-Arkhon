name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      core-tag:
        description: 定制内核 tag（如 v0.9.10-teyvat）。留空=自动取 fork arkhon-core 最新 release
        required: false
        default: ''

# electron-updater 需要创建 Release 并上传资产
permissions:
  contents: write

jobs:
  package:
    name: 打包 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 下载内核与数据（定制内核/geo/wintun，含 sha256 校验）
        env:
          CORE_TAG: ${{ github.event.inputs.core-tag || '' }}
        run: node scripts/download-core.mjs

      - name: 构建基础包与应用
        run: |
          pnpm prebuild-deps
          pnpm --filter @teyvat-arkhon/electron build

      # 发布前内核全链路闸门：订阅导入→启动→路由→流量→热重载（防"本机绿、打包崩"）
      - name: 内核全链路 E2E
        run: node scripts/e2e-core.cjs

      - name: 打包发布
        run: pnpm --filter @teyvat-arkhon/electron exec electron-builder -- --publish always

      # Release 正文：从 CHANGELOG.md 抽取当前 tag 对应版本段落，写入 release body（缺省时静默跳过）
      - name: 写入 Release 说明（CHANGELOG）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="/tmp/release-notes-${VERSION}.md"
          # index() 做固定字符串匹配，避免 "[0.9.8-rc]" 被正则当作字符类误匹配其他标题
          awk -v h2="## [$VERSION]" '
            index($0, h2) == 1 { f=1 }
            f && index($0, "## [") == 1 && index($0, h2) != 1 { exit }
            f { print }
          ' CHANGELOG.md > "$OUT"
          if [ ! -s "$OUT" ]; then echo "未找到 [$VERSION] 段落，跳过"; exit 0; fi
          gh release edit "${GITHUB_REF_NAME}" --notes-file "$OUT" || echo "release body 更新失败（不阻塞）"
          rm -f "$OUT"

      - name: 打包产物启动冒烟（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y && sudo apt-get install -y xvfb
          BIN=$(find apps/electron/release -path '*linux-unpacked*' -type f -executable ! -name '*.so*' | head -n1)
          echo "冒烟二进制: $BIN"
          xvfb-run -a "$BIN" --no-sandbox --disable-gpu > smoke.log 2>&1 &
          PID=$!
          sleep 8
          if kill -0 $PID 2>/dev/null; then
            echo "✓ 应用进程存活，冒烟通过"
            kill $PID || true
          else
            echo "✗ 应用启动即退出，日志如下："
            cat smoke.log || true
            exit 1
          fi

      - name: Smoke test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $exe = Get-ChildItem "apps/electron/release/win-unpacked/*.exe" | Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          Write-Output "Binary: $($exe.FullName)"
          $p = Start-Process $exe.FullName -ArgumentList '--no-sandbox' -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            Write-Error ("App exited early. code=" + $p.ExitCode)
            exit 1
          }
          Write-Output "OK: app process alive"
          Stop-Process -Id $p.Id -Force

      - name: GPL 合规检查（LICENSE 进产物）
        run: |
          test -f apps/electron/release/linux*/*.AppImage -o -f apps/electron/release/*.exe && echo "产物存在"
          find apps/electron/release -name "LICENSE*" | head -3

      - name: 上传产物（无 GH_TOKEN 时仍保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: apps/electron/release/**
          if-no-files-found: ignore